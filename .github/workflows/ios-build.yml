# iOS için imzasız .ipa derler (Mac gerektirmez).
# Çıkan dosya Windows'ta Sideloadly ile Apple ID'nizle imzalanıp iPhone'a kurulur.
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repoda yalnızca Info.plist var; eksik Xcode proje dosyalarını üret,
      # kamera izinlerini içeren kendi Info.plist dosyamızı koru.
      - name: iOS proje dosyalarını oluştur
        run: |
          cp ios/Runner/Info.plist /tmp/Info.plist
          flutter create --platforms=ios --org com.muratcelik --project-name klasorum .
          cp /tmp/Info.plist ios/Runner/Info.plist

      - name: Bağımlılıklar
        run: flutter pub get

      # flutter build ios --no-codesign yeni Xcode sürümlerinde yine de Team istiyor;
      # yalnızca yapılandırmayı Flutter'a bırakıp derlemeyi imzalama kapalı xcodebuild ile yap.
      - name: Xcode yapılandırması
        run: |
          flutter build ios --release --no-codesign --config-only
          if [ ! -d ios/Pods ]; then (cd ios && pod install); fi

      - name: Derle (imzasız)
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/xc \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/xc/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qr klasorum.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: klasorum-ipa
          path: klasorum.ipa
          retention-days: 14
